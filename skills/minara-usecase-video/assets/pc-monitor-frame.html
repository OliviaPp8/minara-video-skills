<!-- PC use case (landscape, device mode): monitor on a desktop background, NO stand.
     Drop the CSS into the composition's <style>; #desk-bg sits behind #cam, #app goes in #screen.
     Geometry (1920×1080 frame): screen = 1440×810 pt × K 1.15 = 1656×931.5 px, bezel 14 px,
     monitor outer 1684×959.5 centred at left 118 / top 60.
     So in JS: K = 1.15, OX = 132, OY = 74 (screen top-left in frame px).
     Desktop background: default is the grayscale silk wallpaper below; to use a real wallpaper image,
     set  #desk-bg { background-image: url(assets/wallpaper.jpg); background-size: cover; }  -->
<style>
#desk-bg { position: absolute; inset: 0; z-index: 0; overflow: hidden;
  background:
    radial-gradient(900px 620px at 18% 22%, rgba(255,255,255,0.55), rgba(255,255,255,0) 70%),
    radial-gradient(1100px 760px at 86% 84%, rgba(160,164,172,0.55), rgba(160,164,172,0) 70%),
    radial-gradient(700px 500px at 70% 18%, rgba(205,208,214,0.6), rgba(205,208,214,0) 70%),
    linear-gradient(135deg, #D9DBDF 0%, #BFC2C8 45%, #9EA2AA 100%); }
#cam { position: absolute; inset: 0; z-index: 1; }
#monitor { position: absolute; left: 118px; top: 60px; width: 1684px; height: 959.5px; border-radius: 26px;
  background: linear-gradient(180deg, #1C1D20 0%, #0E0F11 100%);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.14), inset 0 1px 0 rgba(255,255,255,0.10),
              0 40px 90px rgba(20,22,26,0.45), 0 12px 28px rgba(20,22,26,0.25); }
#screen { position: absolute; left: 14px; top: 14px; width: 1656px; height: 931.5px; border-radius: 12px; overflow: hidden; background: #000; }
#screen #app { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform: scale(1.15); transform-origin: 0 0; }
</style>

<div id="desk-bg"></div>
<div id="cam">
  <div id="monitor"><div id="screen"><div id="app"><!-- product UI --></div></div></div>
  <!-- cursor / overlays that follow the app stay inside #cam, positioned with OX + x*K, OY + y*K -->
</div>
