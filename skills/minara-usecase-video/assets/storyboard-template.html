<!doctype html>
<!-- Replace {{VIDEO_TITLE}}, {{TOTAL_DURATION}}, {{SCENE_COUNT}}, {{PROJECT_SLUG}} and populate scenes before delivery. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{VIDEO_TITLE}} · Storyboard Review</title>
  <style>
    :root {
      --cream: #faf9f5;
      --paper: #fffefb;
      --ink: #15171a;
      --muted: #6e716f;
      --line: #d9d8d2;
      --green: #1ab173;
      --green-soft: #dff5eb;
      --red: #e65d58;
      --red-soft: #fbe8e6;
      --shadow: 0 14px 40px rgba(28, 34, 31, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(rgba(21, 23, 26, 0.025) 1px, transparent 1px),
        var(--cream);
      background-size: 100% 24px;
      font-family: "Figtree", "Avenir Next", "PingFang SC", sans-serif;
    }

    button { font: inherit; }

    .shell {
      width: min(1500px, calc(100% - 48px));
      margin: 0 auto;
      padding: 56px 0 80px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 32px;
      padding-bottom: 28px;
      border-bottom: 2px solid var(--ink);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 28px;
      height: 8px;
      content: "";
      background: var(--green);
      border-radius: 99px;
    }

    h1 {
      margin: 0;
      max-width: 900px;
      font-size: clamp(44px, 5vw, 78px);
      line-height: 0.94;
      letter-spacing: -0.055em;
    }

    .subtitle {
      max-width: 680px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .master-time {
      text-align: right;
    }

    .master-time strong {
      display: block;
      font-size: 32px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
    }

    .master-time span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .toolbar {
      position: sticky;
      z-index: 10;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 -12px 28px;
      padding: 16px 12px;
      background: rgba(250, 249, 245, 0.94);
      border-bottom: 1px solid rgba(21, 23, 26, 0.12);
      backdrop-filter: blur(14px);
    }

    .stats,
    .filters {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stat,
    .filter,
    .copy {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }

    .stat {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 13px;
      font-variant-numeric: tabular-nums;
    }

    .filter,
    .copy {
      cursor: pointer;
      padding: 0 14px;
      transition: 160ms ease;
    }

    .filter:hover,
    .copy:hover { border-color: var(--ink); }

    .filter.active {
      border-color: var(--ink);
      background: var(--ink);
      color: white;
    }

    .copy {
      border-color: var(--green);
      color: #08794b;
    }

    .table-wrap {
      overflow-x: auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .table-head,
    .scene {
      display: grid;
      min-width: 1200px;
      grid-template-columns: 86px 200px minmax(360px, 1fr) 72px 88px 88px 78px 78px 150px;
      align-items: center;
    }

    .table-head {
      min-height: 52px;
      color: var(--muted);
      background: #f0efe9;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .table-head span { padding: 0 18px; }
    .table-head .action-head { text-align: center; }

    .scene {
      position: relative;
      min-height: 112px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      transition: background 150ms ease, box-shadow 150ms ease;
    }

    .scene:last-child { border-bottom: 0; }
    .scene:hover { z-index: 1; background: #f9f8f3; box-shadow: inset 4px 0 0 var(--ink); }
    .scene.aigc.pending { color: #666a68; background: #ececea; box-shadow: inset 5px 0 0 #a6aaa7; }
    .scene.mavis { color: #666a68; background: #ececea; box-shadow: inset 5px 0 0 #a6aaa7; }
    .scene.in-progress { background: #e6f1ff; box-shadow: inset 5px 0 0 #3287df; }
    .scene.approved { background: #e2f5eb; box-shadow: inset 5px 0 0 var(--green); }
    .scene.rejected { background: #fbe8e6; box-shadow: inset 5px 0 0 var(--red); }

    .scene.hidden { display: none; }

    .scene-id {
      padding: 0 18px;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .kind {
      justify-self: center;
      padding: 5px 8px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    .timecode {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 0 18px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .duration {
      display: block;
      color: var(--muted);
      font-size: 15px;
      font-weight: 800;
    }

    .visual {
      display: grid;
      align-items: center;
      margin: 0;
      padding: 20px 26px 20px 18px;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .visual-input {
      box-sizing: border-box;
      width: 100%;
      min-height: 68px;
      overflow: hidden;
      resize: none;
      padding: 8px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      font-weight: 650;
      line-height: 1.45;
      letter-spacing: -0.015em;
    }

    .visual-input:focus {
      outline: none;
      border-color: #b8bbb8;
      background: white;
    }

    .review-button {
      display: grid;
      width: 58px;
      height: 54px;
      place-items: center;
      justify-self: center;
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      font-size: 24px;
      transition: 140ms ease;
    }

    .review-button:hover { transform: translateY(-2px); border-color: var(--ink); box-shadow: 0 8px 18px rgba(21, 23, 26, 0.1); }
    .review-button.yes[aria-pressed="true"] { border: 2px solid var(--green); background: var(--green-soft); }
    .review-button.no[aria-pressed="true"] { border: 2px solid var(--red); background: var(--red-soft); }

    .start-button {
      width: 74px;
      height: 54px;
      justify-self: center;
      cursor: pointer;
      border: 1px solid #3287df;
      border-radius: 12px;
      background: white;
      color: #1768ba;
      font-size: 13px;
      font-weight: 850;
      transition: 140ms ease;
    }

    .start-button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(50, 135, 223, 0.18); }
    .start-button[aria-pressed="true"] { background: #3287df; color: white; }
    .start-button.colleague { cursor: default; border-color: #c8cbc8; background: #dfe1df; color: #737775; font-size: 12px; }
    .start-button.colleague:hover { transform: none; box-shadow: none; }
    .start-button.mavis { border-color: #b9bcb9; color: #5f6361; }
    .start-button.mavis[aria-pressed="true"] { border-color: #a6aaa7; background: #dfe1df; color: #444846; }

    .file-open {
      display: grid;
      place-items: center;
      width: 128px;
      min-height: 50px;
      justify-self: center;
      cursor: pointer;
      padding: 0 12px;
      border: 1px solid var(--ink);
      border-radius: 12px;
      background: var(--ink);
      color: white;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      transition: 140ms ease;
    }

    .file-open:hover { background: var(--green); border-color: var(--green); transform: translateY(-2px); }
    .file-open.disabled {
      cursor: default;
      border-color: #c8cbc8;
      background: #dfe1df;
      color: #737775;
    }
    .file-open.disabled:hover { transform: none; border-color: #c8cbc8; background: #dfe1df; }

    .empty {
      display: none;
      padding: 80px 20px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line);
    }

    .toast {
      position: fixed;
      z-index: 20;
      right: 28px;
      bottom: 28px;
      padding: 13px 18px;
      pointer-events: none;
      opacity: 0;
      color: white;
      background: var(--ink);
      border-radius: 10px;
      transform: translateY(10px);
      transition: 180ms ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 820px) {
      .shell { width: min(100% - 28px, 720px); padding-top: 30px; }
      header { grid-template-columns: 1fr; }
      .master-time { text-align: left; }
      .toolbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">Storyboard review board</div>
        <h1>{{VIDEO_TITLE}}<br>Scene Review</h1>
        <p class="subtitle">每个 Scene 一行。直接点击右侧大号 ✅ 或 🙅 记录态度；点击“复制审阅结果”即可发回当前对话。</p>
      </div>
      <div class="master-time">
        <strong>{{TOTAL_DURATION}}</strong>
        <span>{{SCENE_COUNT}} scenes</span>
      </div>
    </header>

    <div class="toolbar">
      <div class="stats" aria-live="polite">
        <span class="stat">制作中 <b id="progressCount">0</b></span>
        <span class="stat">Mavis <b id="mavisCount">0</b></span>
        <span class="stat">✅ <b id="approvedCount">0</b></span>
        <span class="stat">🙅 <b id="rejectedCount">0</b></span>
        <span class="stat">待审 <b id="pendingCount">0</b></span>
      </div>
      <div class="filters" aria-label="筛选场景">
        <button class="filter active" data-filter="all">全部</button>
        <button class="filter" data-filter="pending">待审</button>
        <button class="filter" data-filter="in-progress">制作中</button>
        <button class="filter" data-filter="mavis">Mavis</button>
        <button class="filter" data-filter="approved">✅</button>
        <button class="filter" data-filter="rejected">🙅</button>
        <button class="copy" id="copyReview">复制审阅结果</button>
      </div>
    </div>

    <div class="table-wrap">
      <div class="table-head" aria-hidden="true">
        <span>Scene</span><span>时间 / 时长</span><span>大概画面</span><span>类型</span>
        <span class="action-head">制作</span><span class="action-head">Mavis</span><span class="action-head">通过</span><span class="action-head">退回</span><span class="action-head">本地文件</span>
      </div>
      <section class="board" id="board" aria-label="Storyboard scenes"></section>
    </div>
    <div class="empty" id="empty">这个筛选条件下没有 Scene。</div>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const scenes = [
      /* Populate from the approved timeline:
       * ["S01", "00:00.000–00:05.000", "5.000s", "MG", "画面概要。"]
       */
    ];

    const sceneFiles = {};
    const finderHelper = "http://127.0.0.1:38131/reveal";
    const storageKey = "storyboard-review-{{PROJECT_SLUG}}";
    const visualKey = "storyboard-visual-{{PROJECT_SLUG}}";
    const state = JSON.parse(localStorage.getItem(storageKey) || "{}");
    const visualState = JSON.parse(localStorage.getItem(visualKey) || "{}");
    let activeFilter = "all";
    const board = document.querySelector("#board");

    function render() {
      board.innerHTML = scenes.map(([id, time, duration, kind, visual]) => {
        const review = state[id] || "pending";
        const hidden = activeFilter !== "all" && review !== activeFilter;
        const sceneFile = sceneFiles[id];
        const currentVisual = visualState[id] ?? visual;
        return `<article class="scene ${kind.toLowerCase()} ${review} ${hidden ? "hidden" : ""}" data-id="${id}">
          <span class="scene-id">${id}</span>
          <div class="timecode"><span>${time}</span><strong class="duration">${duration}</strong></div>
          <div class="visual">
            <textarea class="visual-input" data-saved="${escapeAttribute(currentVisual)}" aria-label="编辑 ${id} 大概画面" oninput="autoResizeVisual(this)" onblur="persistVisual(this)">${escapeHtml(currentVisual)}</textarea>
          </div>
          <span class="kind">${kind}</span>
          ${kind === "AIGC"
            ? `<button class="start-button colleague" disabled>同事制作</button>`
            : `<button class="start-button" aria-label="${review === "in-progress" ? "取消制作" : "开始制作"} ${id}" aria-pressed="${review === "in-progress"}" onclick="setReview('${id}','in-progress')">${review === "in-progress" ? "取消" : "开始"}</button>`}
          <button class="start-button mavis" aria-label="交给 Mavis ${id}" aria-pressed="${review === "mavis"}" onclick="setReview('${id}','mavis')">Mavis</button>
          <button class="review-button yes" aria-label="通过 ${id}" aria-pressed="${review === "approved"}" onclick="setReview('${id}','approved')">✅</button>
          <button class="review-button no" aria-label="不通过 ${id}" aria-pressed="${review === "rejected"}" onclick="setReview('${id}','rejected')">🙅</button>
          ${sceneFile
            ? `<button class="file-open" onclick="openFinder('${id}')">打开 Finder ↗</button>`
            : `<span class="file-open disabled" aria-disabled="true">暂无文件</span>`}
        </article>`;
      }).join("");
      updateStats();
      requestAnimationFrame(autoResizeVisuals);
    }

    function setReview(id, next) {
      persistAllVisuals();
      state[id] = state[id] === next ? "pending" : next;
      localStorage.setItem(storageKey, JSON.stringify(state));
      render();
    }

    function persistVisual(input) {
      const id = input.closest(".scene")?.dataset.id;
      const scene = scenes.find(([sceneId]) => sceneId === id);
      if (!input || !scene) return;
      if (input.value === scene[4]) {
        delete visualState[id];
      } else {
        visualState[id] = input.value;
      }
      localStorage.setItem(visualKey, JSON.stringify(visualState));
      input.dataset.saved = input.value;
      autoResizeVisual(input);
    }

    function persistAllVisuals() {
      document.querySelectorAll(".visual-input").forEach(persistVisual);
    }

    function autoResizeVisual(input) {
      input.style.height = "auto";
      input.style.height = `${input.scrollHeight + 2}px`;
    }

    function autoResizeVisuals() {
      document.querySelectorAll(".visual-input").forEach(autoResizeVisual);
    }

    async function openFinder(id) {
      const target = sceneFiles[id];
      if (!target) return;
      try {
        const response = await fetch(`${finderHelper}?path=${encodeURIComponent(target)}`);
        if (!response.ok) throw new Error(await response.text());
        showToast(`${id} 已在 Finder 中显示`);
      } catch (error) {
        showToast("先运行 start-storyboard-finder.command");
      }
    }

    function updateStats() {
      const values = scenes.map(([id]) => state[id] || "pending");
      progressCount.textContent = values.filter(v => v === "in-progress").length;
      mavisCount.textContent = values.filter(v => v === "mavis").length;
      approvedCount.textContent = values.filter(v => v === "approved").length;
      rejectedCount.textContent = values.filter(v => v === "rejected").length;
      pendingCount.textContent = values.filter(v => v === "pending").length;
      empty.style.display = document.querySelectorAll(".scene:not(.hidden)").length ? "none" : "block";
    }

    document.querySelectorAll(".filter").forEach(button => button.addEventListener("click", () => {
      persistAllVisuals();
      activeFilter = button.dataset.filter;
      document.querySelectorAll(".filter").forEach(item => item.classList.toggle("active", item === button));
      render();
    }));

    function summary() {
      const approved = scenes.filter(([id]) => state[id] === "approved").map(([id]) => id);
      const rejected = scenes.filter(([id]) => state[id] === "rejected").map(([id]) => id);
      const progress = scenes.filter(([id]) => state[id] === "in-progress").map(([id]) => id);
      const mavis = scenes.filter(([id]) => state[id] === "mavis").map(([id]) => id);
      const pending = scenes.filter(([id]) => !state[id] || state[id] === "pending").map(([id]) => id);
      const edits = scenes.filter(([id]) => visualState[id]).map(([id]) => `${id}：${visualState[id]}`);
      return [
        "{{VIDEO_TITLE}} storyboard review",
        `制作中：${progress.join(", ") || "无"}`,
        `Mavis：${mavis.join(", ") || "无"}`,
        `✅ 通过：${approved.join(", ") || "无"}`,
        `🙅 不通过：${rejected.join(", ") || "无"}`,
        `文案修改：${edits.join(" / ") || "无"}`,
        `待审：${pending.join(", ") || "无"}`
      ].join("\n");
    }

    copyReview.addEventListener("click", async () => {
      persistAllVisuals();
      const text = summary();
      if (navigator.clipboard) {
        await navigator.clipboard.writeText(text);
      } else {
        const area = Object.assign(document.createElement("textarea"), { value: text });
        document.body.append(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      showToast("审阅结果已复制");
    });

    window.addEventListener("beforeunload", persistAllVisuals);

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1600);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/\n/g, "&#10;");
    }

    render();
  </script>
</body>
</html>
